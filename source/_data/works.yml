# 作品集数据
#
# 编程项目：不再在此文件维护，改为在 source/works/ 下新建 .md 页面
#   → 模板见 scaffolds/project.md，复制到 source/works/ 下修改即可
#   → 概览页会自动列出所有 type: project 的页面
#
# 文章 / 笔记：继续在此文件的 notes 列表维护
#   每条记录字段：
#     name       名称（必填）
#     url        链接（外链或站内 /posts/xxx/）
#     date       时间（可选）
#     description 一句话简介
#     icon       Font Awesome 图标（可选）
#     tone       卡片色调（可选，默认 green）：green / blue / beige / purple
#     tags       标签数组（可选）

project_title: 编程项目
note_title: 文章 / 笔记

notes:
  - name: 博客搭建记录
    url: /posts/
    date: 2026-08
    description: 记录从零搭建这个二次元博客的全过程与踩坑笔记
    icon: fas fa-pen-nib
    tone: green
    tags: [教程, Hexo]

  - name: 示例笔记
    url: /archives/
    description: 这是一张示例笔记卡片，替换成你自己的文章或笔记
    icon: fas fa-book
    tone: green
    tags: [笔记]
