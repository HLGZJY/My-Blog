# 作品集数据
# 使用方法：
#   新增编程项目 → 在 projects 列表里加一条记录
#   新增文章/笔记 → 在 notes 列表里加一条记录
# 每条记录字段说明：
#   name       作品名称（必填）
#   url        作品链接（外链或站内 /posts/xxx/）
#   description 一句话简介
#   icon       Font Awesome 图标（可选），如 fab fa-github / fas fa-book
#   tags       技术栈/标签数组（可选）

project_title: 编程项目
note_title: 文章 / 笔记

projects:
  - name: My-Blog
    url: /
    description: 本站的源码仓库，基于 Hexo + Butterfly 的二次元风格个人博客
    icon: fas fa-blog
    tags: [Hexo, Butterfly, Markdown]

  - name: 我的第一个开源项目
    url: https://github.com/HLGZJY
    description: 这是一个示例项目卡片，替换成你自己的项目
    icon: fab fa-github
    tags: [JavaScript, GitHub]

notes:
  - name: 博客搭建记录
    url: /posts/
    description: 记录从零搭建这个二次元博客的全过程与踩坑笔记
    icon: fas fa-pen-nib
    tags: [教程, Hexo]

  - name: 示例笔记
    url: /archives/
    description: 这是一张示例笔记卡片，替换成你自己的文章或笔记
    icon: fas fa-book
    tags: [笔记]